<!doctype html>
<html lang="ko" class="scroll-smooth bg-[#111111] text-white">
  <head>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var _fetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(v) {
              _fetch = v;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore error
        }
      })();
    </script>
